name: Gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On pull_request the action enumerates the PR's commits via
      # GET /repos/{owner}/{repo}/pulls/{n}/commits, which 403s without this.
      pull-requests: read
    steps:
      # Full history: a secret committed and later removed is still a leaked
      # secret, and a shallow clone would not see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # GITLEAKS_LICENSE is required for organization-owned repositories only.
      # This repo is owned by a personal account, so the action runs unlicensed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
