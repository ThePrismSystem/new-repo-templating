name: Verify Templates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly drift check. The templates carry no lockfiles, so a scaffold
    # resolves the newest release matching each range - upstream can break
    # them with no change to this repo.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.addon }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report every addon's result. On a drift run the second addon's
      # failure is as informative as the first.
      fail-fast: false
      matrix:
        # `combo` stacks python, lua, powershell and javascript in one
        # scaffold, so it installs each of their toolchains.
        addon: [typescript-node, typescript-react, javascript, python, shell, lua, powershell, docker, combo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `version` is required here: the action falls back to a
      # `packageManager` field, and this repo has no package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      # Node addons run on their own .nvmrc. The others still need Node for
      # markdownlint, so they take the one this repo's test tools use.
      - name: Pick the Node version
        id: node
        env:
          ADDON: ${{ matrix.addon }}
        run: |
          file="templates/addons/$ADDON/files/.nvmrc"
          [[ -f "$file" ]] || file=tests/tools/.nvmrc
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ steps.node.outputs.file }}
          # No pnpm cache: this repo has no lockfile, and caching resolution
          # would blunt the upstream drift the scheduled run exists to catch.

      # The base gate verify.sh runs in each scaffold needs the same tools, at
      # the same versions, as the scaffold's own lint workflow.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install zizmor and typos
        run: python -m pip install --require-hashes -r templates/base/files/.github/requirements-ci.txt

      - name: Install markdownlint
        run: |
          npm ci --ignore-scripts --prefix tests/tools
          echo "$GITHUB_WORKSPACE/tests/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        env:
          # renovate: datasource=github-release-attachments depName=gitleaks/gitleaks
          VERSION: v8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install actionlint
        env:
          # renovate: datasource=github-release-attachments depName=rhysd/actionlint
          VERSION: v1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/${VERSION}/actionlint_${VERSION#v}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP/bin" actionlint
          rm actionlint.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The runner's own shellcheck is older than the one the shell addon pins.
      - name: Install shellcheck
        if: matrix.addon == 'shell'
        env:
          # renovate: datasource=github-release-attachments depName=koalaman/shellcheck
          VERSION: v0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${VERSION}/shellcheck-${VERSION}.linux.x86_64.tar.xz"
          echo "${SHA256}  shellcheck.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xJf shellcheck.tar.xz -C "$RUNNER_TEMP/bin" --strip-components 1 "shellcheck-${VERSION}/shellcheck"
          rm shellcheck.tar.xz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install shfmt
        if: matrix.addon == 'shell'
        env:
          # renovate: datasource=github-release-attachments depName=mvdan/sh
          VERSION: v3.14.1
          SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${VERSION}/shfmt_${VERSION}_linux_amd64"
          echo "${SHA256}  $RUNNER_TEMP/bin/shfmt" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/shfmt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        if: contains(fromJSON('["lua", "combo"]'), matrix.addon)
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1
        if: contains(fromJSON('["lua", "combo"]'), matrix.addon)

      - name: Install the Lua tools
        if: contains(fromJSON('["lua", "combo"]'), matrix.addon)
        run: |
          # renovate: datasource=github-tags depName=lunarmodules/luacheck
          luarocks install luacheck 1.2.0
          # renovate: datasource=github-tags depName=lunarmodules/busted
          luarocks install busted 2.3.0
          # renovate: datasource=github-tags depName=lunarmodules/luacov
          luarocks install luacov 0.17.0
          # renovate: datasource=github-tags depName=daurnimator/luacov-reporter-lcov
          luarocks install luacov-reporter-lcov 0.2

      - name: Install lua-language-server
        if: contains(fromJSON('["lua", "combo"]'), matrix.addon)
        env:
          # renovate: datasource=github-release-attachments depName=LuaLS/lua-language-server
          VERSION: 3.19.2
          SHA256: 93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o luals.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${VERSION}/lua-language-server-${VERSION}-linux-x64.tar.gz"
          echo "${SHA256}  luals.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/lua-language-server"
          tar -xzf luals.tar.gz -C "$RUNNER_TEMP/lua-language-server"
          rm luals.tar.gz
          echo "$RUNNER_TEMP/lua-language-server/bin" >> "$GITHUB_PATH"

      - name: Install the PowerShell modules
        if: contains(fromJSON('["powershell", "combo"]'), matrix.addon)
        shell: pwsh
        run: |
          # renovate: datasource=nuget depName=PSScriptAnalyzer registryUrl=https://www.powershellgallery.com/api/v2/
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          # renovate: datasource=nuget depName=InjectionHunter registryUrl=https://www.powershellgallery.com/api/v2/
          Install-Module InjectionHunter -RequiredVersion 1.0.0 -Scope CurrentUser -Force
          # renovate: datasource=nuget depName=Pester registryUrl=https://www.powershellgallery.com/api/v2/
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Install hadolint
        if: matrix.addon == 'docker'
        env:
          # renovate: datasource=github-release-attachments depName=hadolint/hadolint
          VERSION: v2.15.1
          SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${VERSION}/hadolint-linux-x86_64"
          echo "${SHA256}  $RUNNER_TEMP/bin/hadolint" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Trivy
        if: matrix.addon == 'docker'
        env:
          # renovate: datasource=github-release-attachments depName=aquasecurity/trivy
          VERSION: v0.76.2
          SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/${VERSION}/trivy_${VERSION#v}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP/bin" trivy
          rm trivy.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The shell addon's own tests run on it inside verify.sh, and every
      # addon's slow tests run on it below.
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Verify addon
        if: matrix.addon != 'combo'
        env:
          ADDON: ${{ matrix.addon }}
        run: ./verify.sh --addon "$ADDON"

      - name: Verify the stacked scaffold
        if: matrix.addon == 'combo'
        run: ./verify.sh --combo python,lua,powershell,javascript

      - name: Slow tests for this addon
        if: matrix.addon != 'combo'
        env:
          ADDON: ${{ matrix.addon }}
        run: bats --filter-tags "slow,addon:$ADDON" tests/

  # The powershell addon promises Windows PowerShell 5.1 as well as
  # PowerShell 7, and only a Windows runner has 5.1.
  verify-powershell-windows:
    name: Verify powershell on Windows PowerShell 5.1
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scaffold the addon
        shell: bash
        run: ./setup.sh demo "$(cygpath -u "$RUNNER_TEMP")/demo" --addon powershell --no-install

      - name: Install Pester
        shell: powershell
        run: |
          # renovate: datasource=nuget depName=Pester registryUrl=https://www.powershellgallery.com/api/v2/
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run the tests
        shell: powershell
        working-directory: ${{ runner.temp }}/demo
        run: ./scripts/check-powershell.ps1 test
